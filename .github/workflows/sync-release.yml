name: Sync Harness Harlot release

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}

concurrency:
  group: sync-harness-harlot-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the latest release and prepare publication files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-latest-release.mjs
          tar -cf publication.tar public/install public/releases/stable-macos.json
      - name: Store immutable verified publication files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-publication
          path: publication.tar
          if-no-files-found: error
          retention-days: 1
      - name: Test and build the website without a write credential
        run: |
          npm ci
          npm test
          npm run build

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified publication files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-publication
      - name: Publish a changed release index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' public/install public/releases/stable-macos.json > expected-files
          tar -tf publication.tar > archive-files
          cmp expected-files archive-files
          tar -xf publication.tar
          chmod 755 public/install
          if git diff --quiet -- public/install public/releases/stable-macos.json; then
            echo "Website already points at the latest verified release."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/install public/releases/stable-macos.json
          git commit -m "chore: publish latest verified Harness Harlot release"
          gh auth setup-git
          git push origin HEAD:main
