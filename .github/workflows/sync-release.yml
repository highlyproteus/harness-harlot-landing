name: Sync Harness Harlot release

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}

concurrency:
  group: sync-harness-harlot-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the latest release and prepare publication files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-latest-release.mjs
          publication_files=(
            public/install
            public/install-macos
            public/install-linux
            public/releases/stable-macos.json
            public/releases/stable-linux.json
          )
          v2=public/releases/stable-v2
          refreshed_files_without_intel=(
            $v2/manifest-macos-community-arm64-v2.update.json
            $v2/manifest-macos-community-arm64-v2.update.json.sig
            $v2/manifest-linux-arm64-v2.update.json
            $v2/manifest-linux-arm64-v2.update.json.sig
            $v2/manifest-linux-x86_64-v2.update.json
            $v2/manifest-linux-x86_64-v2.update.json.sig
          )
          refreshed_files_with_intel=(
            "${refreshed_files_without_intel[@]}"
            $v2/manifest-macos-community-x86_64-v2.update.json
            $v2/manifest-macos-community-x86_64-v2.update.json.sig
          )
          if [[ -e $v2 ]]; then
            actual_refreshed_files=$(find $v2 -mindepth 1 -maxdepth 1 -print | LC_ALL=C sort)
            without_intel=$(printf '%s\n' "${refreshed_files_without_intel[@]}" | LC_ALL=C sort)
            with_intel=$(printf '%s\n' "${refreshed_files_with_intel[@]}" | LC_ALL=C sort)
            if [[ "$actual_refreshed_files" == "$with_intel" ]]; then
              publication_files+=("${refreshed_files_with_intel[@]}")
            else
              [[ "$actual_refreshed_files" == "$without_intel" ]]
              publication_files+=("${refreshed_files_without_intel[@]}")
            fi
          fi
          tar -cf publication.tar "${publication_files[@]}"
      - name: Store immutable verified publication files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-publication
          path: publication.tar
          if-no-files-found: error
          retention-days: 1
      - name: Test and build the website without a write credential
        run: |
          npm ci
          npm test
          npm run build

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified publication files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-publication
      - name: Publish a changed release index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' \
            public/install \
            public/install-macos \
            public/install-linux \
            public/releases/stable-macos.json \
            public/releases/stable-linux.json > legacy-files
          v2=public/releases/stable-v2
          printf '%s\n' \
            $v2/manifest-macos-community-arm64-v2.update.json \
            $v2/manifest-macos-community-arm64-v2.update.json.sig \
            $v2/manifest-linux-arm64-v2.update.json \
            $v2/manifest-linux-arm64-v2.update.json.sig \
            $v2/manifest-linux-x86_64-v2.update.json \
            $v2/manifest-linux-x86_64-v2.update.json.sig > refreshed-files-without-intel
          printf '%s\n' \
            $v2/manifest-macos-community-x86_64-v2.update.json \
            $v2/manifest-macos-community-x86_64-v2.update.json.sig > refreshed-files-intel
          tar -tf publication.tar > archive-files
          cp legacy-files expected-files
          case "$(wc -l < archive-files)" in
            13) cat refreshed-files-without-intel refreshed-files-intel >> expected-files ;;
            11) cat refreshed-files-without-intel >> expected-files
                xargs rm -f < refreshed-files-intel ;;
            5) rm -rf public/releases/stable-v2 ;;
            *) echo "unexpected publication file count" >&2; exit 1 ;;
          esac
          cmp expected-files archive-files
          tar -xf publication.tar
          chmod 755 public/install public/install-macos public/install-linux
          mapfile -t expected_paths < expected-files
          if git diff --quiet -- "${expected_paths[@]}" public/releases/stable-v2; then
            echo "Website already points at the latest verified release."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --pathspec-from-file=expected-files
          if [ -e public/releases/stable-v2 ] || [ -n "$(git ls-files public/releases/stable-v2)" ]; then
            git add -A public/releases/stable-v2
          fi
          git commit -m "chore: publish latest verified Harness Harlot release"
          gh auth setup-git
          git push origin HEAD:main
